name: Checks

# Contributor-branch verification. This workflow runs the same non-secret gate
# as local development and must never gain the ability to publish or deploy:
# no registry login, no deployment step, no secrets, and read-only permissions.
#
# `pull_request` is deliberate. A fork pull request runs the workflow file from
# the base branch against the merged tree with a read-only token and no access
# to repository secrets. Never switch this to `pull_request_target`, which would
# expose secrets to fork-authored code.
#
# Pushes to main are included because `publish-service.yml` is path-filtered to
# `service/**`, so a main commit touching only `plugin/**` would otherwise run
# no checks at all.

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Install the exact lockfile
        run: bun install --frozen-lockfile

      - name: Run the non-secret gate
        run: bun run check
