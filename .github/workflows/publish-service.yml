name: Publish service image

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full SHA of the approved signed main tip
        required: true
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-service.yml
      - service/**
      - Dockerfile.service
      - LICENSE
      - package.json
      - bun.lock
      - tsconfig.json
      - scripts/check-service-runtime.ts
      - scripts/deploy-service
      - media/motion-explainer/cukup-explainer.mp4
      - media/motion-explainer/poster.png
      - media/motion-explainer/captions.en.vtt
      - media/motion-explainer/transcript.md
      - media/og-image/og-image.png

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-service-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require main
        env:
          APPROVED_REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            test "$GITHUB_SHA" = "$APPROVED_REVISION"
          else
            test "$GITHUB_EVENT_NAME" = push
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" | jq -e --arg sha "$GITHUB_SHA" \
            '.sha == $sha and .commit.verification.verified == true and .commit.verification.reason == "valid"' >/dev/null
          printf 'IMAGE=ghcr.io/%s\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10

      - name: Verify release source
        run: |
          bun install --frozen-lockfile
          bun run check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Dockerfile.service
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            service=cukup-service
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Verify remote image by digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          test -n "$DIGEST"
          docker buildx imagetools inspect "$IMAGE@$DIGEST"
          docker pull "$IMAGE@$DIGEST"
          test "$(docker image inspect "$IMAGE@$DIGEST" --format '{{.Architecture}}')" = amd64
          docker run --rm --read-only -i --entrypoint bun "$IMAGE@$DIGEST" run - < scripts/check-service-runtime.ts
          printf 'Published `%s@%s` for `linux/amd64`.\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
